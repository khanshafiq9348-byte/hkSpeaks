version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tts_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: tts_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/tts_platform
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data/storage

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: tts_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.processor"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/tts_platform
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - storage_data:/app/data/storage

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: tts_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
