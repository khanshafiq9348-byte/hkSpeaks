services:
  - type: web
    name: hk-speaks-backend
    runtime: python
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_PUBLIC_URL_BASE
        value: /v1/storage
      - key: HOST
        value: 0.0.0.0
